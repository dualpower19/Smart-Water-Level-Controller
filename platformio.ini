; Smart Water Level Controller - ESP32 firmware
; Build:   pio run -e esp32dev
; Flash:   pio run -e esp32dev -t upload
; Monitor: pio device monitor
; Tests:   pio test -e native   (control logic, runs on your PC)

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32 @ 8.0.0   ; Arduino-ESP32 core 3.3.x
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
lib_deps =
    4-20ma/ModbusMaster@^2.0.1
    mandulaj/PZEM-004T-v30@^1.1.2
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
    bblanchon/ArduinoJson@^7.0.4
    ESP32Async/AsyncTCP@^3.3.2
    ESP32Async/ESPAsyncWebServer@^3.6.0

; Host-side unit tests for the pump/protection state machine (no hardware needed)
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
lib_compat_mode = off
